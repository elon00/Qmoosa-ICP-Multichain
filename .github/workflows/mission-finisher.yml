name: Mission Finisher

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Verification mode'
        required: true
        default: 'baseline'
        type: choice
        options:
          - baseline
          - testnet
          - mainnet
      deploy_ic:
        description: 'Deploy ICP canisters after all gates pass (mainnet only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Setup dfx
        uses: dfinity/setup-dfx@main
        with:
          dfx-version: '0.24.0'
      - name: Compile Motoko canisters
        shell: bash
        run: |
          dfx identity new ci --storage-mode plaintext --force >/dev/null 2>&1 || true
          dfx identity use ci >/dev/null 2>&1 || true
          dfx start --background --clean
          dfx canister create --all
          dfx build
          dfx stop
      - name: Run Mission Finisher
        run: node scripts/mission-finisher.js --mode '${{ inputs.mode }}'
      - name: Require mainnet deploy prerequisites
        if: ${{ inputs.deploy_ic && inputs.mode == 'mainnet' }}
        env:
          DFX_IDENTITY_PEM: ${{ secrets.DFX_IDENTITY_PEM }}
        shell: bash
        run: |
          test -n "$DFX_IDENTITY_PEM" || (echo 'DFX_IDENTITY_PEM secret is required.' && exit 20)
          test -f deployments/mainnet-evidence.json || (echo 'mainnet evidence file is required.' && exit 21)
      - name: Deploy ICP mainnet canisters
        if: ${{ inputs.deploy_ic && inputs.mode == 'mainnet' }}
        env:
          DFX_IDENTITY_PEM: ${{ secrets.DFX_IDENTITY_PEM }}
        shell: bash
        run: |
          printf '%s' "$DFX_IDENTITY_PEM" > /tmp/mission-identity.pem
          chmod 600 /tmp/mission-identity.pem
          dfx identity import mission /tmp/mission-identity.pem --storage-mode plaintext --force
          dfx identity use mission
          dfx deploy --network ic
          for c in token dao_governance launchpad x402_gateway agent_orchestrator conway_engine automation pqc frontend; do
            echo "$c=$(dfx canister id --network ic $c)"
          done | tee deployments/ic-canister-ids.txt
          rm -f /tmp/mission-identity.pem
      - name: Upload mission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qmoosa-icp-multichain-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            deployments/mission-finisher-*.json
            deployments/*-evidence.json
            deployments/ic-canister-ids.txt
          if-no-files-found: warn
      - name: Final truth summary
        if: always()
        shell: bash
        run: |
          echo '## Qmoosa ICP Multichain Mission Finisher' >> "$GITHUB_STEP_SUMMARY"
          echo '- Mode: ${{ inputs.mode }}' >> "$GITHUB_STEP_SUMMARY"
          echo '- ICP deploy requested: ${{ inputs.deploy_ic }}' >> "$GITHUB_STEP_SUMMARY"
          echo '- Baseline gates are automated.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Testnet/mainnet remain fail-closed without verifiable live evidence.' >> "$GITHUB_STEP_SUMMARY"
